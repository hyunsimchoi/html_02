<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>ul : 순서 없는 목록</h2>
<ul>
  <li>사과</li>
  <li>바나나</li>
  <li>포도</li>
</ul>

<h2>목록 안의 목록</h2>
<ul>
  <li>
    과일
    <ul>
      <li>사과</li>
      <li>
        포도
        <ul>
          <li>캠벨포도</li>
          <li>샤인머스캣</li>
        </ul>
      </li>
    </ul>
  </li>
  <li>채소</li>
</ul>

<h2>ol : 순서 있는 목록</h2>
<ol type="i">
  <li>
    계획
    <ul>
      <li>주제 정하기</li>
      <li>기간 정하기</li>
      <li>담당 정하기</li>
    </ul>
  </li>
  <li>설계</li>
  <li>개발</li>
</ol>

</body>
</html>
