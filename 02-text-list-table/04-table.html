<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!-- 브라우저는 기본적으로 표에 테두리가 표현이 안됨 -->
    <style>
        table {
            border-collapse: collapse;
            margin-bottom: 24px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;


        }
    </style>
</head>
<body>
<table>
    <thead>
    <tr>
        <th>이름</th>
        <th>나이</th>
        <th>전화번호</th>
    </tr>

    </thead>
    <tbody>
        <tr>
            <td>홍길동</td>
            <td>20</td>
            <td>010-1234-5678</td>

        </tr>
        <tr>
            <td>김철수</td>
            <td>25</td>
            <td>010-9876-5432</td>
        </tr>



    </tbody>

    <table>
        <tr>
            <td rowspan="3">행 병합</td>
            <td>내용1</td>
            <td>내용2</td>
            <td>내용3</td>
        </tr>
        <tr>
            <td>김철수</td>
            <td>25</td>
            <td>010-98</td>
        </tr>

    </table>



</table>

<h2>colspan : 열병합 (옆으로 합치기)</h2>
<table>
    <tbody>
      <tr>
          <td colspn="2">열 병합</td>
          <td>얘는따로</td>

      </tr>
    <tr>
        <td>내용2</td>
        <td>내용3</td>
        <td>내용4</td>
    </tr>


<table>
    <tbody>
      <tr>
          <td>내용1</td>
          <td>내용2</td>
          <td>내용3</td>
      </tr>

      <tr>
          <td>내용4</td>
          <td rowspan="2">내용5</td>
          <td>내용6</td>
      </tr>

      <tr>
          <td>내용7</td>
          <td>내용9</td>
      </tr>
    </tbody>

</table>

    </tbody>

</table>
</body>
</html>
