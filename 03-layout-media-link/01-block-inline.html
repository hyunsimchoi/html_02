<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        div {
            outline: 2px dashed orange;
            background: #fff7ed;

        }
        span {
            outline: 2px dashed deepskyblue;
            background: #f0f9ff;

        }
        div strong {

        }
        div > strong





    </style>
</head>
<body>
    <h2>div : block (한 줄을 통째로 차지)</h2>
    <div>첫 번째 영역을 잡습니다.</div>
    <div>두 번째 영역을 잡습니다.</div>
    <div>
        <h3>제목</h3>
        여러 요소를 하나로 묶을 수 있습니다.


    </div>

    <he>p : 문단 (block, 위 아래에 기본 여백이 있음)</he>
    <p>첫 번째 문단입니다.</p>
    <p>두 번째 문단에는 <strong>강조</strong>와 <a href="#">링크</a>넣음</p>

    <h2>span : inline (내용만큼만 차지, 옆에 다른 요소 배치 가능</h2>
    <p>오늘의 날씨는  <span>맑음</span>, 기온은 <span>25도</span>입니다.</p>
</body>
</html>
