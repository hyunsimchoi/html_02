<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action="" method="get">
<h2>select, option</h2>
<p>
    <label for="city">지역</label>
    <select name="city" id="city">
<!--  html 상, 옵션값들 중에 아무것도 선택(selected)되지 않으면, 첫번째 옵션이 기본값으로 선택되어져 있음-->
        <option value="seoul">서울</option>
        <option value="busan">부산</option>
        <option value="incheon" selected>인천</option>
        <option value="kyunggi">경기</option>
    </select>

</p>
<botton type="submit">가입하기</botton>
<botton type="reset">다시쓰기</botton>
<button type="button">아무 동작하지 않는 버튼</button>
<!-- 보통 javascript를 통해 프로그래밍 해서 기증을 작성 후, -->

</form>
</body>
</html>
